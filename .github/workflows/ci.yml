name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start server
        run: |
          HOST=127.0.0.1 PORT=4321 \
          N8N_WEBHOOK_SECRET=test-secret \
          N8N_SELLER_WEBHOOK_URL=http://127.0.0.1:4999/webhook/keyvora/seller \
          N8N_INVESTOR_WEBHOOK_URL=http://127.0.0.1:4999/webhook/keyvora/investor \
          node ./dist/server/entry.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
      - name: Smoke test
        run: scripts/smoke-test.sh http://127.0.0.1:4321
      - name: API tests
        run: N8N_WEBHOOK_SECRET=test-secret node scripts/api-test.mjs http://127.0.0.1:4321
      - name: Report server log
        if: failure()
        run: |
          tail -n 20 server.log | while IFS= read -r line; do echo "::warning::server: $line"; done
          find dist -maxdepth 3 | head -40 | while IFS= read -r line; do echo "::notice::dist: $line"; done
      - name: QA audit (accessibility, mobile, SEO)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
          node scripts/qa-audit.mjs http://127.0.0.1:4321
      - name: Docker build
        run: docker build -t keyvora-home .
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/client
            server.log
